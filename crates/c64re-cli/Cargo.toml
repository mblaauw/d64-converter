[package]
name = "c64re-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
c64re-assets = { path = "../c64re-assets" }
c64re-capture = { path = "../c64re-capture" }
c64re-d64 = { path = "../c64re-d64" }
c64re-disasm = { path = "../c64re-disasm" }
c64re-machine = { path = "../c64re-machine" }
c64re-probes = { path = "../c64re-probes" }
c64re-provenance = { path = "../c64re-provenance" }
c64re-report = { path = "../c64re-report" }
c64re-trace = { path = "../c64re-trace" }
c64re-vice-bmp = { path = "../c64re-vice-bmp" }
c64re-vic = { path = "../c64re-vic" }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true

[[bin]]
name = "c64re"
path = "src/main.rs"
